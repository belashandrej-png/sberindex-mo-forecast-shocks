# --- Общие настройки ---
general:
  seed: 42
  project_root: "."
  data_dir: "data/hackathonlicence"
  results_dir: "results"
  figures_dir: "figures"
  notebooks_dir: "notebooks"
  report_dir: "report"
  log_level: "INFO"

# --- Данные ---
data:
  consumption_file: "consumption.parquet"
  connection_file: "connection.parquet"
  market_access_file: "market_access.parquet"
  category: "Все категории"
  date_format: "YYYY-MM"
  min_months_per_mo: 24          # МО с полной историей
  reference_municipalities: null
  
# --- Панель и выборка МО ---
panel:
  n_sample: 300                  # стратифицированная выборка
  n_deciles: 10                  # децили по суммарным тратам
  sample_per_decile: 30
  stratify_by: "total_spend"

# --- Горизонты прогнозирования ---
forecast:
  horizons: [1, 3, 6, 12]        # месяцы
  min_train_months: 13           # минимум истории для обучения
  refit_each_horizon: true       # переобучать модель под каждый горизонт

# --- Признаки ---
features:
  # Лаги логарифма потребления
  lags: [1, 2, 3, 6, 12, 13]
  # Скользящие статистики (окно в месяцах)
  rolling_windows: [3, 6, 12]
  rolling_stats: ["mean", "std"]
  # Лаги национального индекса
  nat_lags: [1, 2, 4, 7, 13]
  # Год-к-году
  yoy_lags: [12, 13]
  # Доли категорий (share of total)
  share_categories: ["Продовольствие", "Маркетплейсы"]
  # Календарные признаки
  calendar:
    month_sin: true
    month_cos: true
    is_december: true
    is_january: true
    trend: true                  # линейный тренд t
  # Пространственные признаки
  spatial:
    min_dist: true               # минимальное расстояние до соседа
    market_access: true          # индекс доступности рынков

# --- Модель LightGBM ---
model:
  name: "lightgbm"
  objective: "mae"
  metric: "mae"
  n_estimators: 600
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.0
  reg_lambda: 0.0
  random_state: 42
  verbose: -1
  early_stopping_rounds: null

# --- Базовая модель (Prophet) ---
baseline:
  name: "prophet"
  seasonality_mode: "multiplicative"
  yearly_seasonality: true
  weekly_seasonality: false
  daily_seasonality: false
  changepoint_prior_scale: 0.05
  n_changepoints: 25

# --- Детекторы структурных изменений ---
changepoint:
  methods: ["PELT_l2", "PELT_rbf", "Binseg", "Window", "CUSUM"]
  min_segment_length: 3
  # PELT
  pelt:
    model: "l2"                  # или "rbf"
    penalty: "bic"               # BIC-штраф
  # Binseg
  binseg:
    model: "l2"
    n_bkps: 3
  # Window
  window:
    width: 6
    model: "l2"
    n_bkps: 3
  # CUSUM (offline)
  cusum:
    k: 0.5                       # допуск
    h: 3.5                       # порог
  # Голосование (consensus)
  consensus:
    min_votes: 2                 # событие считается, если ≥2 детекторов
    tolerance_months: 1          # окно совпадения

# --- Онлайн-слой (CUSUM на остатках модели) ---
online_cusum:
  enabled: true
  k: 0.3                         # допуск (меньше → чувствительнее)
  h: 2.5                         # порог срабатывания
  init_window: 6                 # месяцев для оценки μ, σ
  lookback_for_gain: 6           # горизонт оценки выигрыша

# --- Новости ---
news:
  enabled: true
  decay: 0.7                     # λ в exp(−λ·d)
  lead_grid: [0, 1, 2, 3]        # лаги опережения для grid search
  event_window: 4                # месяцев затухания
  car_window: 3                  # месяцев для event study
  significance_threshold: 0.03   # |CAR| > порога → значимое событие
  event_types:
    - factory_open
    - factory_close
    - mall_open
    - road_construction
    - subsidy_program
    - infrastructure
    - festival
    - budget_injection
    - other

# --- Foundation models (бенчмарк) ---
foundation:
  enabled: true
  model: "amazon/chronos-t5-small"   # fallback при недоступности Bolt
  model_bolt: "amazon/chronos-bolt-small"
  device: "cpu"
  torch_dtype: "float32"
  num_samples: 20                # траекторий для uncertainty
  limit_prediction_length: false

# --- Ablation и robustness ---
ablation:
  feature_groups:
    - name: "lags"
      features: ["y_lag1", "y_lag2", "y_lag3", "y_lag6", "y_lag12", "y_lag13"]
    - name: "rolling"
      features: ["y_roll_mean_3", "y_roll_mean_6", "y_roll_mean_12",
                 "y_roll_std_3", "y_roll_std_6", "y_roll_std_12"]
    - name: "yoy"
      features: ["yoy_12", "yoy_13", "nat_yoy"]
    - name: "nat_lags"
      features: ["nat_lag1", "nat_lag2", "nat_lag4", "nat_lag7", "nat_lag13"]
    - name: "shares"
      features: ["share_food", "share_mp"]
    - name: "calendar"
      features: ["month_sin", "month_cos", "is_dec", "is_jan", "trend"]
    - name: "spatial"
      features: ["min_dist", "market_access"]

robustness:
  hyperparam_grid:
    - {n_estimators: 300, num_leaves: 31, learning_rate: 0.10}
    - {n_estimators: 600, num_leaves: 63, learning_rate: 0.05}
    - {n_estimators: 1000, num_leaves: 127, learning_rate: 0.01}
    - {n_estimators: 400, num_leaves: 45, learning_rate: 0.07}
    - {n_estimators: 800, num_leaves: 80, learning_rate: 0.03}
  window_grid:
    widths: [4, 6, 8, 10]
    n_bkps: [2, 3, 4]
  shock_types: ["level", "spike", "trend"]
  shock_magnitude: [0.25, 0.6]
  n_synthetic_shocks: 50

# --- Статистические тесты ---
tests:
  wilcoxon:
    paired: true
    alternative: "two-sided"
  normality:
    method: "shapiro"

# --- Визуализация ---
plot:
  dpi: 150
  figsize: [14, 8]
  style: "seaborn-v0_8-whitegrid"
  palette: ["#4C72B0", "#DD8452", "#55A868", "#C44E52", "#8172B2", "#CCB974", "#64B5CD"]
  save_dir: "figures"
